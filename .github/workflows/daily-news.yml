name: Hermes News daily

on:
  schedule:
    # 11:00 UTC = 06:00 America/Lima
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hermes-news-pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: personal-os

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: personal-os/requirements.txt

      - name: Verify project structure
        run: |
          test -f requirements.txt
          test -f news.html
          test -f scripts/hermes_news.py
          test -f scripts/build_site.py
          test -f config/news_feeds.json
          test -f data/news.json
          test -f tests/test_pipeline.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt

      - name: Test pipeline
        run: python -m unittest discover -s tests -v

      - name: Collect and review news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/hermes_news.py

      - name: Detect meaningful changes
        id: changes
        run: |
          if git diff --quiet -- data/news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No meaningful news changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Validated news changes detected."
          fi

      - name: Build Hermes News site
        if: steps.changes.outputs.changed == 'true'
        run: python scripts/build_site.py

      - name: Prepare complete Pages site
        if: steps.changes.outputs.changed == 'true'
        working-directory: .
        run: |
          rm -rf site_publish
          mkdir -p site_publish

          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="site_publish/" \
            --exclude="personal-os/scripts/" \
            --exclude="personal-os/config/" \
            --exclude="personal-os/tests/" \
            --exclude="personal-os/data/" \
            --exclude="personal-os/_site/" \
            --exclude="personal-os/requirements.txt" \
            --exclude="personal-os/README.md" \
            --exclude="personal-os/IMPLEMENTATION_NOTES.md" \
            ./ site_publish/

          mkdir -p site_publish/personal-os
          rm -rf site_publish/personal-os/*
          cp -a personal-os/_site/. site_publish/personal-os/

      - name: Configure GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_publish

      - name: Commit validated news data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore(news): daily update"
          git push

  deploy:
    if: needs.update.outputs.changed == 'true'
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}personal-os/news.html

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
